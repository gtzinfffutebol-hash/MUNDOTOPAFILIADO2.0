<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mundotopafiliado</title>
  <!-- Fontes Modernas Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ================= VARIÁVEIS DE TEMA (PADRÃO: LARANJA NEON & PRETO PROFUNDO) ================= */
    :root {
      --neon-primary: #ff6a00;
      --neon-primary-rgb: 255, 106, 0;
      --neon-secondary: #ff944d;
      --neon-secondary-rgb: 255, 148, 77;
      --neon-contrast: #050507;

      --bg-deep: #050507;
      --bg-surface: #0d0d12;
      --bg-card: rgba(13, 13, 18, 0.88);
      --bg-glass: rgba(8, 8, 12, 0.88);

      --text-main: #f8fafc;
      --text-muted: #9ca3af;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 14% 12%, rgba(var(--neon-primary-rgb), 0.15) 0%, transparent 42%),
        radial-gradient(circle at 86% 24%, rgba(var(--neon-secondary-rgb), 0.10) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    h1, h2, h3, .marca {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ================= HEADER & GLASSMORPHISM ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 6%;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(var(--neon-primary-rgb), 0.25);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.65), 0 1px 16px rgba(var(--neon-primary-rgb), 0.1);
    }

    .marca-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .marca-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon-primary);
      box-shadow: 0 0 10px var(--neon-primary), 0 0 22px var(--neon-primary);
      animation: pulseNeon 2.4s infinite ease-in-out;
    }

    @keyframes pulseNeon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.28); opacity: 0.72; }
    }

    .marca {
      font-size: 1.38rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff 10%, var(--neon-primary) 55%, var(--neon-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ================= MENU HAMBÚRGUER 3 LINHAS ANIMADO ================= */
    .menu-botao {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.4);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 12px rgba(var(--neon-primary-rgb), 0.14);
    }

    .menu-botao:hover {
      border-color: var(--neon-primary);
      background: rgba(var(--neon-primary-rgb), 0.12);
      box-shadow: 0 0 18px rgba(var(--neon-primary-rgb), 0.45);
    }

    .menu-botao .linha {
      width: 22px;
      height: 2.5px;
      background: #ffffff;
      border-radius: 4px;
      transition: all 0.32s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.45);
    }

    .menu-botao.ativo {
      border-color: var(--neon-primary);
      box-shadow: 0 0 20px rgba(var(--neon-primary-rgb), 0.55);
    }

    .menu-botao.ativo .linha:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg);
      background: var(--neon-primary);
      box-shadow: 0 0 10px var(--neon-primary);
    }

    .menu-botao.ativo .linha:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .menu-botao.ativo .linha:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg);
      background: var(--neon-secondary);
      box-shadow: 0 0 10px var(--neon-secondary);
    }

    /* ================= DROPDOWN MENU GLASSMORPHISM ================= */
    .menu {
      position: absolute;
      top: 72px;
      right: 6%;
      width: 270px;
      padding: 12px;
      background: rgba(13, 13, 18, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.4);
      border-radius: 16px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.88), 0 0 26px rgba(var(--neon-primary-rgb), 0.18);
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.96);
      transition: all 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60;
    }

    .menu.aberto {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      color: var(--text-main);
      font-size: 0.96rem;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .menu-item svg {
      width: 18px;
      height: 18px;
      color: var(--neon-primary);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .menu-item:hover {
      background: rgba(var(--neon-primary-rgb), 0.12);
      color: #ffffff;
      padding-left: 18px;
    }

    .menu-item:hover svg {
      transform: scale(1.15);
      filter: drop-shadow(0 0 6px var(--neon-primary));
    }

    .menu-divisor {
      height: 1px;
      margin: 8px 4px;
      background: linear-gradient(90deg, transparent, rgba(var(--neon-primary-rgb), 0.65), transparent);
    }

    .btn-menu-afiliado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      margin-top: 2px;
      color: var(--neon-contrast);
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      border: none;
      border-radius: 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(var(--neon-primary-rgb), 0.45);
      transition: all 0.25s ease;
    }

    .btn-menu-afiliado:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(var(--neon-primary-rgb), 0.75);
      filter: brightness(1.08);
    }

    /* ================= HERO SECTION ================= */
    .hero {
      padding: 72px 7% 64px;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
      background: radial-gradient(ellipse at 76% 35%, rgba(var(--neon-primary-rgb), 0.18), transparent 62%);
    }

    .hero-inner {
      max-width: 820px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--neon-secondary);
      background: rgba(var(--neon-primary-rgb), 0.12);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.4);
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(var(--neon-primary-rgb), 0.18);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 18px;
      color: #ffffff;
    }

    .hero h1 span {
      background: linear-gradient(95deg, var(--neon-primary) 15%, var(--neon-secondary) 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(var(--neon-primary-rgb), 0.35));
    }

    .hero p {
      color: var(--text-muted);
      font-size: clamp(1.02rem, 2vw, 1.2rem);
      max-width: 620px;
      margin-bottom: 28px;
    }

    .btn-cta-hero {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 14px 26px;
      color: var(--neon-contrast);
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 0 24px rgba(var(--neon-primary-rgb), 0.5);
      transition: all 0.25s ease;
    }

    .btn-cta-hero:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 34px rgba(var(--neon-primary-rgb), 0.8);
      filter: brightness(1.06);
    }

    /* Barra de Busca em Tempo Real */
    .busca-wrapper {
      margin-top: 30px;
      max-width: 580px;
    }

    .busca {
      display: flex;
      align-items: center;
      background: rgba(13, 13, 18, 0.9);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.35);
      border-radius: 999px;
      padding: 6px 6px 6px 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .busca:focus-within {
      border-color: var(--neon-primary);
      box-shadow: 0 0 24px rgba(var(--neon-primary-rgb), 0.4), 0 8px 30px rgba(0, 0, 0, 0.65);
    }

    .busca-icon {
      color: var(--neon-primary);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .busca input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 0.98rem;
      outline: none;
      padding: 8px 4px;
    }

    .busca input::placeholder {
      color: #6b7280;
    }

    .btn-limpar-busca {
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-right: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      color: #d1d5db;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-limpar-busca.visivel {
      display: flex;
    }

    .btn-limpar-busca:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .btn-buscar {
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      color: var(--neon-contrast);
      border: none;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(var(--neon-primary-rgb), 0.45);
      transition: all 0.2s ease;
    }

    .btn-buscar:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 24px rgba(var(--neon-primary-rgb), 0.75);
    }

    /* ================= MAIN & SEÇÕES ================= */
    main {
      padding: 48px 7% 72px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .secao-titulo {
      font-size: clamp(1.55rem, 3vw, 2.05rem);
      font-weight: 700;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .secao-titulo::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 26px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--neon-primary), var(--neon-secondary));
      box-shadow: 0 0 12px var(--neon-primary);
    }

    /* Como Funciona */
    .passos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .cartao {
      padding: 22px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .cartao:hover {
      border-color: rgba(var(--neon-primary-rgb), 0.45);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55), 0 0 20px rgba(var(--neon-primary-rgb), 0.14);
    }

    .cartao strong {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.14rem;
      color: var(--neon-primary);
      margin-bottom: 6px;
    }

    .cartao p {
      color: var(--text-muted);
      font-size: 0.94rem;
    }

    /* 3 Selos como Botões Individuais Laranjas */
    .selos {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 48px;
    }

    .selo-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      color: var(--neon-contrast);
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.93rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(var(--neon-primary-rgb), 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .selo-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 28px rgba(var(--neon-primary-rgb), 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      filter: brightness(1.07);
    }

    .selo-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* ================= CATEGORIAS PÍLULA ================= */
    .categorias {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 28px;
    }

    .categoria {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .categoria:hover {
      color: #ffffff;
      border-color: rgba(var(--neon-primary-rgb), 0.55);
      background: rgba(var(--neon-primary-rgb), 0.1);
    }

    .categoria.ativa {
      color: var(--neon-contrast);
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      border-color: var(--neon-primary);
      box-shadow: 0 0 18px rgba(var(--neon-primary-rgb), 0.52);
    }

    .cat-contador {
      font-size: 0.78rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      color: inherit;
    }

    /* ================= GRADE & CARDS DE PRODUTOS ================= */
    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 22px;
    }

    .produto {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .produto::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(var(--neon-primary-rgb), 0.55), transparent 50%, rgba(var(--neon-secondary-rgb), 0.45));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .produto:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(var(--neon-primary-rgb), 0.55);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75), 0 0 26px rgba(var(--neon-primary-rgb), 0.24);
    }

    .produto:hover::before {
      opacity: 1;
    }

    .produto-midia {
      width: 100%;
      height: 155px;
      margin-bottom: 16px;
      border-radius: 13px;
      background: radial-gradient(circle at center, rgba(var(--neon-primary-rgb), 0.14), rgba(5, 5, 7, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .produto-midia img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .produto:hover .produto-midia img {
      transform: scale(1.07);
    }

    .produto .icone {
      font-size: 3.4rem;
      filter: drop-shadow(0 0 14px rgba(var(--neon-primary-rgb), 0.4));
      transition: transform 0.3s ease;
    }

    .produto:hover .icone {
      transform: scale(1.12) rotate(-4deg);
    }

    .produto-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--neon-secondary);
      background: rgba(var(--neon-primary-rgb), 0.14);
      border: 1px solid rgba(var(--neon-primary-rgb), 0.35);
      border-radius: 6px;
    }

    .selo-verificado {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .produto h3 {
      font-size: 1.18rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .produto p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 18px;
      flex: 1;
    }

    /* Botão CTA Ver Oferta com Brilho Animado */
    .comprar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      color: var(--neon-contrast);
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      border: none;
      border-radius: 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.98rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(var(--neon-primary-rgb), 0.45);
      transition: all 0.25s ease;
    }

    .comprar::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-20deg);
      transition: left 0.55s ease;
    }

    .comprar:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(var(--neon-primary-rgb), 0.78);
    }

    .comprar:hover::after {
      left: 150%;
    }

    .sem-link {
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
